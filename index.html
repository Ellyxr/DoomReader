<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Read EPUBs and PDFs as a scrolling feed. Your library stays on your device." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DoomReader</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white. Keep in sync with src/hooks/prefs.ts.
      try {
        var p = JSON.parse(localStorage.getItem('doomreader:prefs') || '{}')
        var t = p.theme || 'system'
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
